[package]
name = "logline"
version = "0.1.0"
edition = "2024"
description = "The home estate's one log line, written and read the same way as the Go package"
license = "MIT"
repository = "https://forgejo.romaine.life/romaine-life/logline"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
